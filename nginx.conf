server {
    listen 80;
    server_name .tanoclo.domain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    ssl_certificate /etc/nginx/ssl/tanoclo.fullchain;
    ssl_certificate_key /etc/nginx/ssl/tanoclo.key;
    
    # TLS hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    
    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    # Ensure Express-set headers pass through (nginx add_header can mask upstream headers)
    proxy_pass_header Access-Control-Allow-Origin;
    proxy_pass_header Access-Control-Allow-Credentials;
    proxy_pass_header X-Request-Id;

    access_log /var/log/nginx/tanoclo.access.log;
    error_log  /var/log/nginx/tanoclo.error.log;
    server_name .tanoclo.domain.com;
    client_max_body_size 64M;

    # SSE events endpoint - needs long read timeout and buffering disabled
    location ~ /api/homes/\d+/events {
        proxy_pass http://tanoclo-ws:3111;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;  # 24 hours
        proxy_buffering off;
        chunked_transfer_encoding off;
        proxy_cache off;
    }

    # Proxy everything to Node.js
    location / {
        proxy_pass http://tanoclo-ws:3111;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Standard timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
