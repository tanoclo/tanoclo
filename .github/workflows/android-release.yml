name: Android Native Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Native APK Release Version (e.g. 0.2.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: tanoclo-workflows-queue
  queue: max

jobs:
  build-native-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java 22
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '22'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies & build web SPA
        run: |
          cd frontend-new
          npm ci || npm install
          npm run build
          npx cap sync android

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: "${{ env.KEYSTORE_BASE64 != '' }}"
        run: echo "$KEYSTORE_BASE64" | base64 -d > frontend-new/android/app/release.keystore

      - name: Build signed Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd frontend-new/android
          chmod +x ./gradlew
          ./gradlew assembleRelease -PVERSION_NAME=${{ github.event.inputs.version }} -PVERSION_CODE=${{ github.run_number }}

      - name: Force-push single orphan commit to ota branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 1. Locate and save APK to temp directory
          APK_PATH=$(find frontend-new/android/app/build/outputs/apk/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: No APK file found in build outputs!"
            exit 1
          fi
          echo "Found APK at $APK_PATH"
          cp "$APK_PATH" /tmp/tanoclo.apk

          # 2. Collect release notes from git log
          PREV_TAG=$(git describe --tags --match "ws-server-v*" --abbrev=0 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            NOTES=$(git log "$PREV_TAG"..HEAD --oneline --no-merges | head -20 | sed 's/^[a-f0-9]* /- /')
          else
            NOTES=$(git log -n 10 --oneline --no-merges | sed 's/^[a-f0-9]* /- /')
          fi
          [ -z "$NOTES" ] && NOTES="- Native APK update"
          # Use heredoc delimiter for multiline env var
          {
            echo "RELEASE_NOTES<<EOF_NOTES"
            echo "$NOTES"
            echo "EOF_NOTES"
          } >> "$GITHUB_ENV"

          # 3. Try fetching existing manifest.json and dist.zip from ota branch so we preserve web dist
          curl -s -f https://raw.githubusercontent.com/tanoclo/tanoclo/ota/dist.zip -o /tmp/dist.zip || true
          curl -s -f https://raw.githubusercontent.com/tanoclo/tanoclo/ota/manifest.json -o /tmp/manifest.json || true

          # 4. Create fresh orphan branch without commit history
          git checkout --orphan ota_orphan
          git rm -rf . 2>/dev/null || true

          # 5. Restore files
          cp /tmp/tanoclo.apk tanoclo.apk
          if [ -f /tmp/dist.zip ]; then cp /tmp/dist.zip dist.zip; fi
          if [ -f /tmp/manifest.json ]; then cp /tmp/manifest.json manifest.json; fi

          RUN_NUM=${{ github.run_number }}
          APK_VERSION="${{ github.event.inputs.version }}"

          # 6. Update manifest with real release notes
          node -e "
            const fs = require('fs');
            const releaseNotes = process.env.RELEASE_NOTES || 'Native APK update';
            let manifest = {
              webVersionCode: ${RUN_NUM},
              webVersionName: '${APK_VERSION}',
              apkVersionCode: ${RUN_NUM},
              apkVersionName: '${APK_VERSION}',
              zipUrl: 'https://raw.githubusercontent.com/tanoclo/tanoclo/ota/dist.zip',
              apkUrl: 'https://raw.githubusercontent.com/tanoclo/tanoclo/ota/tanoclo.apk',
              releaseNotes: releaseNotes
            };
            if (fs.existsSync('manifest.json')) {
              try {
                const existing = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
                manifest = { ...existing, apkVersionCode: ${RUN_NUM}, apkVersionName: '${APK_VERSION}', releaseNotes: releaseNotes };
              } catch (e) {}
            }
            fs.writeFileSync('manifest.json', JSON.stringify(manifest, null, 2));
          "

          git add tanoclo.apk manifest.json
          if [ -f dist.zip ]; then git add dist.zip; fi

          git commit -m "release: native APK v${APK_VERSION}"
          git push -f origin ota_orphan:ota
