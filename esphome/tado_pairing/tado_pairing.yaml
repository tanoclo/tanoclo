# ESPHome Configuration for Tado RF Pairing Controller
# Target Board: TTGO LoRa32 v1 / v1.6 (ESP32 with onboard SX1276 LoRa transceiver)
# Purpose: Actively mimics a Tado device to recover operational RF keys.

esphome:
  name: tado-pairing
  # Configure boot actions to link UI entity components with the main C++ class
  on_boot:
    priority: -10 # Run after all sensor and text entities have been instantiated
    then:
      - lambda: |-
          // Pass UI entity references to the tado_rf_pairing C++ component
          id(tado_rf_pairing).set_target_ib_mac_text(id(target_ib_mac));
          id(tado_rf_pairing).set_target_va_mac_text(id(target_va_mac));
          id(tado_rf_pairing).set_stored_rf_key_sensor(id(stored_rf_key));
          id(tado_rf_pairing).set_sniffer_channel_number(id(sniffer_channel));
          id(tado_rf_pairing).set_tx_power_number(id(tx_power));

esp32:
  board: ttgo-lora32-v1
  # Use esp-idf framework instead of arduino for better control of interrupts and RTOS tasks
  framework:
    type: esp-idf

# Enable logging
logger:
  level: INFO

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2

web_server:
  port: 80

ota:
  - platform: esphome
    password: !secret ota_password

safe_mode:
  disabled: true

# Configure SPI for SX1276 (LoRa32 V1.6.1 pins)
spi:
  clk_pin: 5
  mosi_pin: 27
  miso_pin: 19

# External component configuration
external_components:
  - source:
      type: git
      url: https://github.com/tanoclo/tanoclo
      path: esphome/tado_pairing/components
    components: [ tado_pairing ]

tado_pairing:
  id: tado_rf_pairing
  cs_pin: 18
  dio0_pin: 26
  dio2_pin: 34
  rst_pin: 14

button:
  - platform: template
    name: "Retrieve RF key"
    id: reset_va_mimic
    icon: "mdi:key-chain"
    on_press:
      then:
        - lambda: |-
            id(tado_rf_pairing).start_reset_mimic_challenge();

  - platform: template
    name: "Reset everything"
    id: reset_everything
    icon: "mdi:refresh"
    on_press:
      then:
        - lambda: |-
            id(tado_rf_pairing).reset_target_devices();
  - platform: restart
    name: "Reboot"
    id: reboot_esp

number:
  - platform: template
    name: "Sniffer Channel"
    id: sniffer_channel
    icon: "mdi:radio-tower"
    min_value: 0
    max_value: 49
    step: 1
    initial_value: 26
    mode: box
    optimistic: true
    set_action:
      lambda: |-
        id(tado_rf_pairing).set_channel_runtime((int)x);

  - platform: template
    name: "TX Power"
    id: tx_power
    icon: "mdi:transmission-tower"
    min_value: 0
    max_value: 15
    step: 1
    initial_value: 15
    mode: box
    optimistic: true
    set_action:
      lambda: |-
        id(tado_rf_pairing).set_tx_power((int)x);

text:
  - platform: template
    name: "Target IB MAC"
    id: target_ib_mac
    icon: "mdi:router-wireless"
    mode: text
    optimistic: true
    set_action:
      lambda: |-
        id(tado_rf_pairing).set_target_ib_mac(x);

  - platform: template
    name: "Target VA MAC"
    id: target_va_mac
    icon: "mdi:handheld-giga-receiver"
    mode: text
    optimistic: true
    set_action:
      lambda: |-
        id(tado_rf_pairing).set_target_va_mac(x);

text_sensor:
  - platform: template
    name: "Stored RF Key"
    id: stored_rf_key
    icon: "mdi:key"