esphome:
  name: tado-emulator
  friendly_name: "TaNoClo Tado Device Emulator"

esp32:
  board: ttgo-lora32-v1
  framework:
    type: esp-idf
    advanced:
      sram1_as_iram: true
      
wifi:
  ssid: "YourSSID"
  password: "YourPassword"

ota:
  - platform: esphome
    password: "YourOTAPassword"

logger:
  level: INFO

web_server:
  port: 80

# Configure SPI for SX1276 (TTGO LoRa32 pins)
spi:
  clk_pin: 5
  mosi_pin: 27
  miso_pin: 19

external_components:
  - source: components

tado_emulator:
  id: tado_rf_emulator
  cs_pin: 18
  rst_pin: 23
  dio0_pin: 26
  channel: 26
  server_url: "http://192.168.0.10:3111"
  auto_mac_ack: true
  api_key: ""

