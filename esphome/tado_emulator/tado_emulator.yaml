esphome:
  name: tado-emulator
  friendly_name: "TaNoClo Tado Device Emulator"

esp32:
  board: ttgo-lora32-v1
  framework:
    type: esp-idf
    advanced:
      sram1_as_iram: true
      
wifi:
  ssid: "YourSSID"
  password: "YourPassword"

ota:
  - platform: esphome
    password: "YourOTAPassword"

logger:
  level: WARN
  tx_buffer_size: 4096
  task_log_buffer_size: 2048

web_server:
  port: 80

# Configure SPI for SX1276 (TTGO LoRa32 pins)
spi:
  clk_pin: 5
  mosi_pin: 27
  miso_pin: 19

# External component configuration
external_components:
  - source:
      type: git
      url: https://github.com/tanoclo/tanoclo
      path: esphome/tado_emulator/components
    components: [ tado_emulator ]

tado_emulator:
  id: tado_rf_emulator
  cs_pin: 18
  rst_pin: 23
  dio0_pin: 26
  channel: 26
  server_url: "http://192.168.0.10:3111"
  auto_mac_ack: true
  api_key: ""
  fast_fifo_drain: true  # default is true; set false to revert to 10ms/15-byte mode

