# ESPHome Configuration for Tado RF Packet Sniffer
# Target Board: TTGO LoRa32 v1 / v1.6 (ESP32 with onboard SX1276 LoRa transceiver)
# Purpose: Passively sniffs Tado RF packets and forwards them over TCP.

esphome:
  name: tado-sniffer

esp32:
  board: ttgo-lora32-v1
  # Use esp-idf framework instead of arduino for better control of interrupts and RTOS tasks
  framework:
    type: esp-idf

# Enable logging
logger:
  level: INFO
  tx_buffer_size: 1024

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2

ota:
  - platform: esphome
    password: !secret ota_password

safe_mode:
  disabled: true

# Configure SPI for SX1276 (LoRa32 V1.6.1 pins)
spi:
  clk_pin: 5
  mosi_pin: 27
  miso_pin: 19

# External component configuration
external_components:
  - source:
      type: git
      url: https://github.com/tanoclo/tanoclo
      path: esphome/tado_sniffer/components
    components: [ tado_sniffer ]

tado_sniffer:
  id: tado_rf_sniffer
  cs_pin: 18
  dio0_pin: 26
  dio2_pin: 34
  rst_pin: 14
  channel: 26
  tcp_host: "192.168.0.1"
  tcp_port: 9999
  ignore_beacons: false