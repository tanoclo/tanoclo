# ESPHome Configuration for Tado RF Packet Sniffer
# Target Board: TTGO LoRa32 v1 / v1.6 (ESP32 with onboard SX1276 LoRa transceiver)
# Purpose: Passively sniffs Tado RF packets and forwards them over TCP.

esphome:
  name: tado-sniffer
  # Configure boot actions to link UI entity components with the main C++ class
  on_boot:
    priority: -10 # Run after all sensor and control entities have been instantiated
    then:
      - lambda: |-
          // Pass UI entity references to the tado_rf_sniffer C++ component
          id(tado_rf_sniffer).set_sniff_raw_switch(id(sniff_raw));
          id(tado_rf_sniffer).set_sniffer_channel_number(id(sniffer_channel));
          id(tado_rf_sniffer).set_tcp_port_number(id(tcp_port));
          id(tado_rf_sniffer).set_tcp_host_text(id(tcp_host));
          id(tado_rf_sniffer).set_print_stats_switch(id(print_stats_toggle));

esp32:
  board: ttgo-lora32-v1
  # Use esp-idf framework instead of arduino for better control of interrupts and RTOS tasks
  framework:
    type: esp-idf

# Enable logging
logger:
  level: INFO
  tx_buffer_size: 1024

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2

web_server:
  port: 80

ota:
  - platform: esphome
    password: !secret ota_password

safe_mode:
  disabled: true

# Configure SPI for SX1276 (LoRa32 V1.6.1 pins)
spi:
  clk_pin: 5
  mosi_pin: 27
  miso_pin: 19

# External component configuration
external_components:
  - source:
      type: git
      url: https://github.com/tanoclo/tanoclo
      path: esphome/tado_sniffer/components
    components: [ tado_sniffer ]

tado_sniffer:
  id: tado_rf_sniffer
  cs_pin: 18
  dio0_pin: 26
  dio2_pin: 34
  rst_pin: 14

button:
  - platform: restart
    name: "Restart Tado Sniffer"

switch:
  - platform: template
    name: "Log Raw Packets"
    id: sniff_raw
    icon: "mdi:ip-network"
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    turn_on_action:
      lambda: |-
        id(tado_rf_sniffer).set_sniff_raw(true);
    turn_off_action:
      lambda: |-
        id(tado_rf_sniffer).set_sniff_raw(false);

  - platform: template
    name: "Print Diagnostic Stats"
    id: print_stats_toggle
    icon: "mdi:chart-bar"
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    turn_on_action:
      lambda: |-
        id(tado_rf_sniffer).set_print_stats_runtime(true);
    turn_off_action:
      lambda: |-
        id(tado_rf_sniffer).set_print_stats_runtime(false);

number:
  - platform: template
    name: "Sniffer Channel"
    id: sniffer_channel
    icon: "mdi:radio-tower"
    min_value: 0
    max_value: 49
    step: 1
    initial_value: 26
    mode: box
    optimistic: true
    set_action:
      lambda: |-
        id(tado_rf_sniffer).set_channel_runtime((int)x);

  - platform: template
    name: "TCP Port"
    id: tcp_port
    icon: "mdi:port"
    min_value: 1024
    max_value: 65535
    step: 1
    initial_value: 9999
    mode: box
    optimistic: true
    set_action:
      lambda: |-
        id(tado_rf_sniffer).set_tcp_port_runtime((int)x);

text:
  - platform: template
    name: "TCP Host"
    id: tcp_host
    icon: "mdi:ip"
    mode: text
    optimistic: true
    set_action:
      lambda: |-
        id(tado_rf_sniffer).set_tcp_host_runtime(x);