  /devices/{deviceId}/temperatureOffset:
    get:
      summary: Get the temperature offset for the given device.
      description: >
        Depending on how close the tado measuring device in a room is to the
        heating/cooling source, the measured temperature might be off.

        The offset instructs TaNoClo to increase/decrease the measured
        temperature by a certain amount, before it starts using the value as
        input for automated temperature control.
      operationId: getTemperatureOffset
      tags:
        - device
      parameters:
        - in: path
          name: deviceId
          schema:
            $ref: "#/components/schemas/DeviceId"
          required: true
      responses:
        "200":
          description: successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Temperature"
        "401":
          $ref: "#/components/responses/Unauthorized401"
        "403":
          $ref: "#/components/responses/AccessDenied403"
    put:
      summary: Set the temperature offset for the given device (there is no DELETE for
        this resource).
      description: >
        Depending on how close the tado measuring device in a room is to the
        heating/cooling source, the measured temperature might be off.

        The offset instructs TaNoClo to increase/decrease the measured
        temperature by a certain amount, before it starts using the value as
        input for automated temperature control.
      operationId: setTemperatureOffset
      tags:
        - device
      parameters:
        - in: path
          name: deviceId
          schema:
            $ref: "#/components/schemas/DeviceId"
          required: true
          description: the serialNo of a tado device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Temperature"
            examples:
              celsius:
                value:
                  celsius: 1.75
              fahrenheit:
                value:
                  fahrenheit: -2.25
      responses:
        "200":
          description: successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Temperature"
        "401":
          $ref: "#/components/responses/Unauthorized401"
        "403":
          $ref: "#/components/responses/AccessDenied403"
        "422":
          $ref: "#/components/responses/InputError422"
  /homes/{homeId}/devices:
    get:
      summary: Get all tado devices associated with the provided homeId.
      description: >
        There are multiple ways to list the tado devices in a home or zone:

        * GET /homes/{homeId}/devices **this operation**

        * GET /homes/{homeId}/deviceList

        * GET /homes/{homeId}/zones

        * GET /homes/{homeId}/zones/{zoneId}/control


        Distinguishing features of **this operation**:

        * **DeviceType 'IB01'**: device of DeviceType 'IB01' (Internet Bridge)
        is included in the response

        * **duties**: the response does not tell you the duties of each device

        * **zone**: the response does not tell you the zone each device belongs
        to
      operationId: getDevices
      tags:
        - device
      parameters:
        - in: path
          name: homeId
          schema:
            $ref: "#/components/schemas/HomeId"
          required: true
          description: unique ID of a home the authenticated user has access to
      responses:
        "200":
          description: successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Device"
        "401":
          $ref: "#/components/responses/Unauthorized401"
        "403":
          $ref: "#/components/responses/AccessDenied403"
  /homes/{homeId}/deviceList:
    get:
      summary: Get all tado devices associated with the provided homeId, together with
        the zone (a.k.a. room) they are in.
      description: >
        There are multiple ways to list the tado devices in a home or zone:

        * GET /homes/{homeId}/devices 

        * GET /homes/{homeId}/deviceList **this operation**

        * GET /homes/{homeId}/zones

        * GET /homes/{homeId}/zones/{zoneId}/control


        Distinguishing features of **this operation**:

        * **DeviceType 'IB01'**: device of DeviceType 'IB01' (Internet Bridge)
        is included in the response

        * **duties**: the response only tells you if the device has a UI duty,
        no other duties (like driver or leader) are mentioned

        * **zone**: the response tells you the zone each device belongs to
      operationId: getDeviceList
      tags:
        - device
      parameters:
        - in: path
          name: homeId
          schema:
            $ref: "#/components/schemas/HomeId"
          required: true
          description: unique ID of a home the authenticated user has access to
      responses:
        "200":
          description: successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceList"
        "401":
          $ref: "#/components/responses/Unauthorized401"
        "403":
          $ref: "#/components/responses/AccessDenied403"
  /homes/{homeId}/installations:
    get:
      summary: Response only contains AC installations; will be empty when there are
        no ACs in the home.
      operationId: getInstallations
      tags:
