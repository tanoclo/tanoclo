        `/homes/{homeId}/zones/{zoneId}/schedule/activeTimetable`).


        Each timetable for a timetable type consists of an array of blocks. Each
        block consists of a day type (e.g. MONDAY_TO_FRIDAY for the THREE_DAY
        timetable type), a start time and end time  and the setting (e.g.
        temperature) for that time period.
      operationId: getTimetableBlocksByDayType
      tags:
        - zone control
      parameters:
        - in: path
          name: homeId
          schema:
            $ref: "#/components/schemas/HomeId"
          required: true
          description: unique ID of a home the authenticated user has access to
        - in: path
          name: zoneId
          schema:
            $ref: "#/components/schemas/ZoneId"
          required: true
          description: ID of a zone (unique within a home)
        - in: path
          name: timetableTypeId
          schema:
            $ref: "#/components/schemas/TimetableTypeId"
          required: true
          example: 1
          description: ID of a timetable type
        - in: path
          name: dayType
          schema:
            $ref: "#/components/schemas/DayType"
          required: true
          example: MONDAY_TO_FRIDAY
          description: name of a day type
      responses:
        "200":
          description: successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimetableBlock"
        "401":
          $ref: "#/components/responses/Unauthorized401"
        "403":
          $ref: "#/components/responses/AccessDenied403"
        "404":
          $ref: "#/components/responses/NotFound404"
    put:
      summary: Update the timetable (containing all blocks!) for the given zoneId,
        timetableTypeId and dayType
      operationId: setTimetableBlocksForDayType
      tags:
        - zone control
      parameters:
        - in: path
          name: homeId
          schema:
            $ref: "#/components/schemas/HomeId"
          required: true
          description: unique ID of a home the authenticated user has access to
        - in: path
          name: zoneId
          schema:
            $ref: "#/components/schemas/ZoneId"
          required: true
          description: ID of a zone (unique within a home)
        - in: path
          name: timetableTypeId
          schema:
            $ref: "#/components/schemas/TimetableTypeId"
          required: true
          example: 1
          description: ID of a timetable type
        - in: path
          name: dayType
          schema:
            $ref: "#/components/schemas/DayType"
          required: true
          example: MONDAY_TO_FRIDAY
          description: name of a day type
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/TimetableBlock"
            examples:
              heating-workday:
                value:
                  - dayType: MONDAY_TO_FRIDAY
                    start: 00:00
                    end: 07:00
                    geolocationOverride: false
                    setting:
                      type: HEATING
                      power: ON
                      temperature:
                        celsius: 15
                  - dayType: MONDAY_TO_FRIDAY
                    start: 07:00
                    end: 08:30
                    geolocationOverride: false
                    setting:
                      type: HEATING
                      power: ON
                      temperature:
                        celsius: 19.5
                  - dayType: MONDAY_TO_FRIDAY
                    start: 08:30
                    end: 17:30
                    geolocationOverride: false
                    setting:
                      type: HEATING
                      power: ON
                      temperature:
                        celsius: 15
                  - dayType: MONDAY_TO_FRIDAY
                    start: 17:30
                    end: 00:00
                    geolocationOverride: false
                    setting:
                      type: HEATING
                      power: ON
                      temperature:
                        celsius: 19.5
      responses:
        "200":
          description: successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimetableBlock"
        "401":
          $ref: "#/components/responses/Unauthorized401"
        "403":
          $ref: "#/components/responses/AccessDenied403"
        "404":
          $ref: "#/components/responses/NotFound404"
        "422":
          $ref: "#/components/responses/InputError422"
