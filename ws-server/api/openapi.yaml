    ZoneAwayConfiguration:
      type: object
      description: >
        Controls the (temperature) settings for a zone when the home the zone
        belongs to is in AWAY mode. The scheduled timetable settings are not
        used in such a situation.

        Used in /homes/{homeId}/zones/{zoneId}/awayConfiguration.
      properties:
        type:
          $ref: "#/components/schemas/ZoneType"
        autoAdjust:
          type: boolean
          example: false
          description: property present for zone type HEATING
        comfortLevel:
          type: string
          nullable: true
          description: property present for zone type HEATING
        setting:
          $ref: "#/components/schemas/ZoneSetting"
    ZoneCapabilities:
      type: object
      description: >
        The presence of the various properties depends on the ZoneType and
        capabilities of the zone who's capabilities are requested. E.g.
        `temperatures` will not be available for a HOT_WATER zone with
        `canSetTemperature: false`.

        Used in /homes/{homeId}/zones/{zoneId}/capabilities.
      properties:
        type:
          $ref: "#/components/schemas/ZoneType"
        temperatures:
          $ref: "#/components/schemas/TemperatureCapability"
        canSetTemperature:
          type: boolean
          example: false
          description: property available for zone type HOT_WATER
        AUTO:
          $ref: "#/components/schemas/AirConditioningModeCapabilitiesBase"
        HEAT:
          $ref: "#/components/schemas/AirConditioningModeCapabilities"
        FAN:
          $ref: "#/components/schemas/AirConditioningModeCapabilities"
        COOL:
          $ref: "#/components/schemas/AirConditioningModeCapabilities"
        DRY:
          $ref: "#/components/schemas/AirConditioningModeCapabilities"
        initialStates:
          type: object
          properties:
            mode:
              $ref: "#/components/schemas/AirConditioningMode"
            modes:
              type: object
              properties:
                COOL:
                  $ref: "#/components/schemas/AirConditioningZoneSettings"
                HEAT:
                  $ref: "#/components/schemas/AirConditioningZoneSettings"
                DRY:
                  $ref: "#/components/schemas/AirConditioningZoneSettings"
                FAN:
                  $ref: "#/components/schemas/AirConditioningZoneSettings"
                AUTO:
                  $ref: "#/components/schemas/AirConditioningZoneSettingsBase"
    ZoneCreate:
      description: Input for POST /home/{homeId}/zones
      type: object
      properties:
        type:
          type: string
          example: IMPLICIT_CONTROL
          description: "known values: IMPLICIT_CONTROL"
        zoneType:
          $ref: "#/components/schemas/ZoneType"
        devices:
          type: array
          items:
            type: object
            properties:
              serialNo:
                $ref: "#/components/schemas/DeviceId"
    ZoneControl:
      description: >
        Result of /homes/{homeId}/zones/{zoneId}/control.


        Groups the devices in a given zone by their duty.

        The elements included in the result depend on the ZoneType:

        * AIR_CONDITIONING: _unknown_

        * HEATING: includes earlyStartEnabled, heatingCircuit, duties.leader,
        duties.drivers and duties.uis

        * HOT_WATER: includes duties.driver and duties.ui
      type: object
      properties:
        type:
          $ref: "#/components/schemas/ZoneType"
        earlyStartEnabled:
          type: boolean
          example: true
          description: applicable for ZoneType HEATING
        heatingCircuit:
          $ref: "#/components/schemas/HeatingCircuitId"
        duties:
          type: object
          properties:
            type:
              $ref: "#/components/schemas/ZoneType"
            driver:
              $ref: "#/components/schemas/Device"
            drivers:
              type: array
              items:
                $ref: "#/components/schemas/Device"
            leader:
              $ref: "#/components/schemas/Device"
            leaders:
              type: array
              items:
                $ref: "#/components/schemas/Device"
            ui:
              $ref: "#/components/schemas/Device"
            uis:
              type: array
              items:
                $ref: "#/components/schemas/Device"
    ZoneDetailsInput:
      description: Used in PUT /homes/{homeId}/zones/{zoneId}/details
      type: object
      properties:
        name:
          type: string
          example: bed room
    ZoneId:
      type: integer
      example: 3
      description: ID of a zone (unique only within the home it belongs to)
    ZoneOpenWindow:
      type: object
      description: >
        Open Window is set when Tado detects an open window in the zone. While
        Open Window is active, heating is switched off.
      properties:
        detectedTime:
          type: string
          format: date-time
        durationInSeconds:
          type: integer
        expiry:
          type: string
          format: date-time
        remainingTimeInSeconds:
          type: integer
    ZoneOverlay:
      type: object
      description: >
        A zone overlay is a user controlled override for the user defined
        scheduled (temperature) settings of a zone. As long as a zone overlay is
        present for a zone, the zone's scheduled (temperature) settings do not
        take effect.

        Termination of the zone overlay (either never, a set time or when the
        next block in the active timetable starts)  is part of the zone overlay
        definition.
      properties:
        type:
          $ref: "#/components/schemas/ZoneOverlayType"
        setting:
          $ref: "#/components/schemas/ZoneSetting"
        termination:
          $ref: "#/components/schemas/ZoneOverlayTermination"
    ZoneOverlays:
      description: input for POST /homes/{homeId}/overlay
      type: object
      properties:
        overlays:
          type: array
          items:
            type: object
            properties:
              room:
                $ref: "#/components/schemas/ZoneId"
              overlay:
                $ref: "#/components/schemas/ZoneOverlay"
    ZoneOverlayTermination:
      type: object
      example: MANUAL
      description: Defines if/how the overlay terminates.
      properties:
        type:
          $ref: "#/components/schemas/ZoneOverlayTerminationType"
        durationInSeconds:
          type: integer
          example: 1400
          description: applicable when termination.type = TIMER
        remainingTimeInSeconds:
          type: integer
          example: 1400
          description: applicable when termination.type = TIMER
        typeSkillBasedApp:
          $ref: "#/components/schemas/ZoneOverlayTerminationTypeSkillBasedApp"
        expiry:
          type: string
          format: date-time
          example: 2024-08-14T23:07:13Z
          nullable: true
          description: applicable when termination.type = TIMER
        projectedExpiry:
          type: string
          format: date-time
          example: 2024-08-14T23:07:13Z
          nullable: true
          description: applicable when termination.type = TIMER
    ZoneOverlayTerminationType:
      type: string
      enum:
        - MANUAL
        - TADO_MODE
        - TIMER
      example: MANUAL
      description: >
        Element of a zone overlay.

        Does not contain NEXT_TIME_BLOCK which is present in the
        ZoneOverlayTerminationTypeSkillBasedApp enum.

        Value descriptions:

        * MANUAL: the (temperature) settings in the ZoneOverlay will last
        indefinitely

        * TIMER: the (temperature) settings in the ZoneOverlay will last for a
        fixed number of seconds,  starting at the moment the ZoneOverlay was set
        (requires setting durationInSeconds as well)

        * TADO_MODE: the (temperature) settings in the ZoneOverlay will last
        until the next time block in the active timetable starts
    ZoneOverlayTerminationTypeSkillBasedApp:
      type: string
      description: >
        When setting a ZoneOverlay this value is used to specify until when the
        ZoneOverlay should be active.


        Compared to ZoneOverlayTerminationType it contains NEXT_TIME_BLOCK as an
        extra value.


        Value descriptions:

        * MANUAL: the (temperature) settings in the ZoneOverlay will last
        indefinitely

        * TIMER: the (temperature) settings in the ZoneOverlay will last for a
        fixed number of seconds,  starting at the moment the ZoneOverlay was set
        (requires setting durationInSeconds as well)

        * TADO_MODE and NEXT_TIME_BLOCK: the (temperature) settings in the
        ZoneOverlay will last until the next time block in the active timetable
        starts


        NEXT_TIME_BLOCK could be a deprecated value. The app features which
        allow a user to set an ZoneOverlay (or a DefaultZoneOverlay) only offer
        options that translate into MANUAL, TIMER or TADO_MODE.
      enum:
        - MANUAL
        - TADO_MODE
        - TIMER
        - NEXT_TIME_BLOCK
      example: MANUAL
    ZoneOverlayType:
      type: string
      example: MANUAL
      description: Type of a ZoneOverlay. Only known value is MANUAL, but not entirely
        sure, so no enum
    ZoneSetting:
      type: object
      description: >
        (temperature) settings for a zone which is used in scheduled
        TimeTableBlocks,  in ZoneOverlays (manual override for the scheduled
        setting), and in AwayConfiguration (settings to be used when the home is
        in AWAY mode).


        The applicable properties depend on the zone type and the zone
        capabilities.
      allOf:
        - $ref: "#/components/schemas/AirConditioningZoneSettingsBase"
        - properties:
            type:
              $ref: "#/components/schemas/ZoneType"
            power:
              $ref: "#/components/schemas/Power"
            temperature:
              $ref: "#/components/schemas/Temperature"
            mode:
              $ref: "#/components/schemas/AirConditioningMode"
            isBoost:
              type: boolean
              example: true
    ZoneSettingTimeSeries:
      type: object
      description: element of DayReport
      properties:
        timeSeriesType:
          type: string
          example: dataIntervals
        valueType:
          type: string
          example: heatingSetting
          description: |
            known values:
            * heatingSetting 
            * airConditioningSetting
        dataIntervals:
          type: array
          items:
            $ref: "#/components/schemas/ZoneSettingDataInterval"
    ZoneSettingDataInterval:
      type: object
      description: element of DayReport
      allOf:
        - $ref: "#/components/schemas/DataInterval"
        - properties:
            value:
              $ref: "#/components/schemas/ZoneSetting"
    ZoneState:
      type: object
      description: Result of /homes/{homeId}/zone/{zoneId}/state
      properties:
        tadoMode:
          $ref: "#/components/schemas/HomePresence"
        geolocationOverride:
          type: boolean
          example: true
        geolocationOverrideDisableTime:
          nullable: true
        preparation:
          nullable: true
        setting:
          $ref: "#/components/schemas/ZoneSetting"
        overlayType:
          $ref: "#/components/schemas/ZoneOverlayType"
          nullable: true
        overlay:
          $ref: "#/components/schemas/ZoneOverlay"
          nullable: true
        openWindow:
          $ref: "#/components/schemas/ZoneOpenWindow"
          nullable: true
        nextScheduleChange:
          type: object
          nullable: true
          properties:
            start:
              type: string
              format: date-time
            setting:
              $ref: "#/components/schemas/ZoneSetting"
        nextTimeBlock:
          type: object
          properties:
            start:
              type: string
              format: date-time
              example: 2024-07-31T20:00:00.000Z
        link:
          type: object
          properties:
            state:
              type: string
              example: ONLINE
              description: |
                known values: 
                * ONLINE
                * OFFLINE
            reason:
              type: object
              properties:
                code:
                  type: string
                  example: disconnectedDevice
                title:
                  type: string
                  example: There is a disconnected device.
        runningOfflineSchedule:
          type: boolean
          example: false
        activityDataPoints:
          $ref: "#/components/schemas/ActivityDataPoints"
        sensorDataPoints:
          $ref: "#/components/schemas/SensorDataPoints"
    ZoneStates:
      type: object
      description: Result of /homes/{homeId}/zoneStates. Basically a map with a zoneID
        as key and ZoneState as value.
      properties:
        zoneStates:
          description: a dictionary with zone IDs (a.k.a. room IDs) as keys
          additionalProperties:
            $ref: "#/components/schemas/ZoneState"
    ZoneType:
      type: string
      enum:
        - AIR_CONDITIONING
        - HEATING
        - HOT_WATER
      example: HEATING
tags:
  - name: user
    description: >
      Retrieve information about the authenticated user, or other users who have
      access to a home(s). 
  - name: home
    description: >
      List and configure information about a home (a house or apartment)
      controlled by tado. 
  - name: home control
    description: >
      Operations related to determining whether someone is at home or
      not  (which impacts a home's temperature control). 
  - name: heating circuit
    description: >
      Operations to determine the heating circuits in your tado home and control
      how zones (a.k.a. rooms) are associated with heating circuits. 
  - name: zone
    description: |
      Retrieve and configure information about a zone (a.k.a. room). 
  - name: zone control
    description: |
      All operations directly associated with temperature control in a zone. 
  - name: device
    description: |
      Determine and configure the tado devices in a home or zone. 
  - name: mobile device
    description: >
      Retrieve information about and set settings for mobile devices linked to
      users  which have the tado app installed to control a home. 
  - name: report
    description: Data reports.
  - name: invitation
    description: Manage invitations.
  - name: ota
    description: Over-the-air update distribution for web client, Android APK, and server.
