    get:
      summary: Get the user defined timetable blocks for the given zoneId and given
        timetableTypeId.
      description: >
        For each zone you can define three different timetables, where each
        timetable is identified by a timetable type: 

        * ONE_DAY (the same schedule for every day of the week),

        * THREE_DAY (the same schedule for weekdays, and a separate schedule for
        saturday and sunday) and

        * SEVEN_DAY (a different schedule for each day of the week).


        Only one of these timetables can be active at any one time  (see
        `/homes/{homeId}/zones/{zoneId}/schedule/activeTimetable`).


        Each timetable for a timetable type consists of an array of blocks. Each
        block consists of a day type (e.g. MONDAY_TO_FRIDAY for the THREE_DAY
        timetable type), a start time and end time  and the setting (e.g.
        temperature) for that time period.
      operationId: getZoneTimetableBlocks
      tags:
        - zone control
      parameters:
        - in: path
          name: homeId
          schema:
            $ref: "#/components/schemas/HomeId"
          required: true
          description: unique ID of a home the authenticated user has access to
        - in: path
          name: zoneId
          schema:
            $ref: "#/components/schemas/ZoneId"
          required: true
          description: ID of a zone (unique within a home)
        - in: path
          name: timetableTypeId
          schema:
            $ref: "#/components/schemas/TimetableTypeId"
          required: true
          example: 1
          description: ID of a timetable type
      responses:
        "200":
          description: successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimetableBlock"
        "401":
          $ref: "#/components/responses/Unauthorized401"
        "403":
          $ref: "#/components/responses/AccessDenied403"
        "404":
          $ref: "#/components/responses/NotFound404"
