        - COLD
        - COMFY
        - WARM
        - HOT
      example: WARM
      description: Used in AirComfort
    TemperaturePrecision:
      type: object
      description: |
        Even when temperature precision is reported as 0.1, 
        the API can report temperatures with a higher precision like 17.52
      properties:
        celsius:
          type: number
          format: float
          example: 0.1
        fahrenheit:
          type: number
          format: float
          example: 0.1
    TemperatureTimeSeries:
      type: object
      description: Element of DayReport, used to express inside temperature.
      properties:
        timeSeriesType:
          type: string
          example: dataPoints
        valueType:
          type: string
          example: temperature
        min:
          $ref: "#/components/schemas/Temperature"
        max:
          $ref: "#/components/schemas/Temperature"
        dataPoints:
          type: array
          items:
            $ref: "#/components/schemas/TemperatureDataPointInTimeSeries"
    TemperatureUnit:
      type: string
      enum:
        - CELSIUS
        - FAHRENHEIT
      example: CELSIUS
    TimetableBlock:
      type: object
      description: Time segment of a scheduled timetable to control the (temperature)
        settings of a zone (a.k.a. room)
      properties:
        dayType:
          $ref: "#/components/schemas/DayType"
        start:
          type: string
          format: time
          example: 21:00
          description: start time of this block in 24 hour clock notation
        end:
          type: string
          format: time
          example: 22:00
          description: end time of this block in 24 hour clock notation
        geolocationOverride:
          type: boolean
          example: false
          description: >
            When false, the settings of this time block are only active when
            TaNoClo is in HOME mode.  If in AWAY mode, TaNoClo will use the
            AwayConfiguration settings for this zone.

            When true, the settings of this time block are always active,
            regardless of whether TaNoClo is in HOME or AWAY mode.
        setting:
          $ref: "#/components/schemas/ZoneSetting"
    TimetableType:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/TimetableTypeId"
        type:
          $ref: "#/components/schemas/TimetableTypeType"
    TimetableTypeId:
      type: integer
      enum:
        - 0
        - 1
        - 2
      example: 0
      description: 0 = ONE_DAY, 1 = THREE_DAY, 2 = SEVEN_DAY
    TimetableTypeType:
      type: string
      enum:
        - ONE_DAY
        - THREE_DAY
        - SEVEN_DAY
      example: ONE_DAY
      description: >
        Each zone has a schedule which controls the zone's (temperature)
        settings based on day of the week and time. Each schedule consists of
        three timetables, one for each timeTableType.  Only one timetable is
        active at anyone time.

        The timetable type controls the granularity of `DayType`s used in the
        timetable:

        * ONE_DAY = a timetable which support a single day type
        (MONDAY_TO_SUNDAY), used for every day of the week   

        * THREE_DAY = a timetable which supports 3 day types, one for
        MONDAY_TO_FRIDAY, one for SATURDAY and one for SUNDAY

        * SEVEN_DAY = at timetable which supports 7 day types, one for every day
        of the week
    UnderfloorHeating:
