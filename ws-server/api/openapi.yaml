openapi: 3.0.0
info:
  title: TaNoClo API Documentation
  description: >
    Server documentation for TaNoClo. Fully compatible with community
    integrations like pytado and Home Assistant.

    This specification builds upon the community-managed Tado OpenAPI v2
    specification by kritsel (available at
    https://github.com/kritsel/tado-openapispec-v2).
  version: 2026.08.14.1
servers:
  - url: /api/v2
    description: TaNoClo API v2 base
  - url: /
    description: TaNoClo root base
security:
  - oauth2: []
paths:
  /me:
    get:
      summary: Returns information about the authenticated user, (summary) information
        of their home(s) and mobile devices.
      operationId: getMe
      tags:
        - user
      responses:
        "200":
          description: successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized401"
  /homes/{homeId}/users:
    get:
      summary: Get all users associated with the provided homeId.
      operationId: getUsers
      tags:
        - user
      parameters:
        - in: path
          name: homeId
          schema:
            $ref: "#/components/schemas/HomeId"
          required: true
          description: unique ID of a home the authenticated user has access to
      responses:
        "200":
          description: successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized401"
        "403":
          $ref: "#/components/responses/AccessDenied403"
  /homes/{homeId}/mobileDevices:
    get:
      summary: Get all mobile devices associated with the provided homeId
      operationId: getMobileDevices
      tags:
        - mobile device
      parameters:
        - in: path
          name: homeId
          schema:
            $ref: "#/components/schemas/HomeId"
          required: true
          description: unique ID of a home the authenticated user has access to
      responses:
        "200":
          description: successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MobileDevice"
        "401":
          $ref: "#/components/responses/Unauthorized401"
        "403":
          $ref: "#/components/responses/AccessDenied403"
  /homes/{homeId}/mobileDevices/{mobileDeviceId}:
    get:
      summary: Get a specific mobile device associated with the provided homeId
      operationId: getMobileDevice
      tags:
        - mobile device
      parameters:
        - in: path
          name: homeId
          schema:
            $ref: "#/components/schemas/HomeId"
          required: true
          description: unique ID of a home the authenticated user has access to
        - in: path
          name: mobileDeviceId
          schema:
            $ref: "#/components/schemas/MobileDeviceId"
          required: true
      responses:
        "200":
          description: successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileDevice"
        "401":
          $ref: "#/components/responses/Unauthorized401"
        "403":
          $ref: "#/components/responses/AccessDenied403"
    delete:
      summary: Remove the relationship between a mobile device and a home
      operationId: deleteMobileDeviceFromHome
      tags:
        - mobile device
      parameters:
        - in: header
          name: Content-Type
          schema:
            type: string
            pattern: application/json
            example: application/json
          required: true
          description: >
            Strangely enough a 'Content-Type' header with value
            'application/json'  is mandatory for this specific endpoint. No
            other endpoint requires it.
        - in: path
          name: homeId
          schema:
            $ref: "#/components/schemas/HomeId"
          required: true
          description: unique ID of a home the authenticated user has access to
        - in: path
          name: mobileDeviceId
          schema:
            type: integer
            format: int64
          required: true
          description: ID of a mobile device
      responses:
        "200":
          description: successful response
        "401":
          $ref: "#/components/responses/Unauthorized401"
        "403":
          $ref: "#/components/responses/AccessDenied403"
        "404":
          $ref: "#/components/responses/NotFound404"
  /homes/{homeId}/mobileDevices/{mobileDeviceId}/settings:
    get:
      summary: Get the settings for a specific mobile device which is associated with
        the given home
      operationId: getMobileDeviceSettings
      tags:
        - mobile device
      parameters:
        - in: path
          name: homeId
          schema:
            $ref: "#/components/schemas/HomeId"
          required: true
          description: unique ID of a home the authenticated user has access to
        - in: path
          name: mobileDeviceId
          schema:
            $ref: "#/components/schemas/MobileDeviceId"
          required: true
      responses:
        "200":
          description: successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileDeviceSettings"
        "401":
          $ref: "#/components/responses/Unauthorized401"
        "403":
          $ref: "#/components/responses/AccessDenied403"
    put:
      summary: Update the settings for a specific mobile device which is associated
        with the given home
      operationId: setMobileDeviceSettings
      tags:
        - mobile device
      parameters:
        - in: path
          name: homeId
          schema:
            $ref: "#/components/schemas/HomeId"
          required: true
          description: unique ID of a home the authenticated user has access to
        - in: path
          name: mobileDeviceId
          schema:
            type: integer
            format: int64
          required: true
          description: ID of a mobile device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileDeviceSettings"
            examples:
              enable-geotracking:
                value:
                  geoTrackingEnabled: true
              disable-geotracking:
                value:
                  geoTrackingEnabled: false
      responses:
        "200":
          description: successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileDeviceSettings"
        "401":
          $ref: "#/components/responses/Unauthorized401"
        "403":
          $ref: "#/components/responses/AccessDenied403"
        "404":
          $ref: "#/components/responses/NotFound404"
        "422":
          $ref: "#/components/responses/InputError422"
  /homes/{homeId}:
    get:
      summary: Get full details of a single home.
      description: Use `GET /me` to determine the `homeId` of your home
      operationId: getHome
      tags:
        - home
      parameters:
        - in: path
          name: homeId
          schema:
            $ref: "#/components/schemas/HomeId"
          required: true
          description: unique ID of a home the authenticated user has access to
      responses:
        "200":
          description: successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Home"
        "401":
          $ref: "#/components/responses/Unauthorized401"
        "403":
          $ref: "#/components/responses/AccessDenied403"
  /homes/{homeId}/airComfort:
    get:
      summary: Get humidity and temperature indicators for all zones (rooms) in this
        home
      description: "'Climate comfort' element in the app"
      operationId: getAirComfort
      tags:
        - home
      parameters:
        - in: path
          name: homeId
          schema:
            $ref: "#/components/schemas/HomeId"
          required: true
          description: unique ID of a home the authenticated user has access to
      responses:
        "200":
          description: successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AirComfort"
        "401":
          $ref: "#/components/responses/Unauthorized401"
        "403":
          $ref: "#/components/responses/AccessDenied403"
  /homes/{homeId}/awayRadiusInMeters:
    put:
      summary: Set the geo-tracking distance.
      description: >
        When the distance between home location and the location of a mobile
        device which can control this home is greater than this distance,
        TaNoClo considers the mobile device to be outside of home.
      operationId: setAwayRadiusInMeters
      tags:
        - home
      parameters:
        - in: path
          name: homeId
          schema:
            $ref: "#/components/schemas/HomeId"
          required: true
          description: unique ID of a home the authenticated user has access to
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AwayRadiusInput"
      responses:
        "204":
          description: successful response
        "401":
          $ref: "#/components/responses/Unauthorized401"
        "403":
          $ref: "#/components/responses/AccessDenied403"
        "422":
          $ref: "#/components/responses/InputError422"
  /homes/{homeId}/details:
    put:
      summary: Set home details for this home.
      description: >
        This endpoint expects a complete HomeDetails object,  you cannot send a
        partial object which only contains the properties you would like to
        update.
      operationId: setHomeDetails
      tags:
        - home
      parameters:
        - in: path
          name: homeId
          schema:
            $ref: "#/components/schemas/HomeId"
          required: true
          description: unique ID of a home the authenticated user has access to
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HomeDetails"
      responses:
        "204":
          description: successful response
        "401":
          $ref: "#/components/responses/Unauthorized401"
        "403":
          $ref: "#/components/responses/AccessDenied403"
        "422":
          $ref: "#/components/responses/InputError422"
  /homes/{homeId}/heatingCircuits:
    get:
      summary: Get information about the heating circuits of this home.
      operationId: getHeatingCircuits
      tags:
        - heating circuit
      parameters:
        - in: path
          name: homeId
          schema:
            $ref: "#/components/schemas/HomeId"
          required: true
          description: unique ID of a home the authenticated user has access to
      responses:
        "200":
          description: successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HeatingCircuit"
        "401":
          $ref: "#/components/responses/Unauthorized401"
        "403":
          $ref: "#/components/responses/AccessDenied403"
  /homes/{homeId}/heatingSystem:
    get:
      summary: Get information about the presence of various heating systems in this
        home
      operationId: getHeatingSystem
      tags:
        - home
      parameters:
        - in: path
          name: homeId
          schema:
            $ref: "#/components/schemas/HomeId"
          required: true
          description: unique ID of a home the authenticated user has access to
      responses:
        "200":
          description: successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeatingSystem"
        "401":
          $ref: "#/components/responses/Unauthorized401"
        "403":
          $ref: "#/components/responses/AccessDenied403"
  /homes/{homeId}/heatingSystem/boiler:
    put:
      summary: Inform TaNoClo about the presence of a boiler in this home
      description: >
        When setting the boiler presence to true with a boiler id, the TaNoClo
        api does not seem to generate any errors when you supply an unknown
        boiler id.  The resulting response of /homes/{homeId}/heatingSystem will
        always have boiler.id set to the supplied boiler id value and
        boiler.found set to true.


        The app assists the user in finding the boiler by brand and model.  This
        is supported by TaNoClo's graphql API, and not via the API described in
        this definition.
      operationId: setBoiler
      tags:
        - home
      parameters:
        - in: path
          name: homeId
          schema:
            $ref: "#/components/schemas/HomeId"
          required: true
          description: unique ID of a home the authenticated user has access to
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Boiler1"
            examples:
              not-present:
                value:
                  present: false
              present_no-id:
                value:
                  present: true
              present_with-id:
                value:
                  present: true
                  id: 2699
      responses:
        "204":
          description: successful response
        "401":
          $ref: "#/components/responses/Unauthorized401"
        "403":
          $ref: "#/components/responses/AccessDenied403"
        "422":
          $ref: "#/components/responses/InputError422"
  /homes/{homeId}/heatingSystem/underfloorHeating:
    put:
      summary: Inform TaNoClo about the presence of underfloor heating in this home
      operationId: setUnderfloorHeating
      tags:
        - home
      parameters:
        - in: path
          name: homeId
          schema:
            $ref: "#/components/schemas/HomeId"
          required: true
          description: unique ID of a home the authenticated user has access to
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnderfloorHeating"
            examples:
              not-present:
                value:
                  present: false
              present:
                value:
                  present: true
      responses:
        "204":
          description: successful response
        "401":
          $ref: "#/components/responses/Unauthorized401"
        "403":
          $ref: "#/components/responses/AccessDenied403"
        "422":
          $ref: "#/components/responses/InputError422"
  /homes/{homeId}/incidentDetection:
    get:
      summary: Get the value of the incidentDetection setting for this home.
      operationId: getIncidentDetection
      tags:
        - home
      parameters:
        - in: path
          name: homeId
          schema:
            $ref: "#/components/schemas/HomeId"
          required: true
          description: unique ID of a home the authenticated user has access to
      responses:
        "200":
          description: successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentDetection"
        "401":
          $ref: "#/components/responses/Unauthorized401"
        "403":
          $ref: "#/components/responses/AccessDenied403"
    put:
      summary: Enable or disable incident detection setting for this home.
      description: >
        You won't be able to enable incident detection when it is not supported
        for your home.

        See the description for GET /homes/{homeId}/incidentDetection for more
        information.
      operationId: setIncidentDetection
      tags:
        - home
      parameters:
        - in: path
          name: homeId
          schema:
            $ref: "#/components/schemas/HomeId"
          required: true
          description: unique ID of a home the authenticated user has access to
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncidentDetectionInput"
            examples:
              enable:
                value:
                  enabled: true
              disable:
                value:
                  enabled: false
      responses:
        "204":
          description: successful response
        "401":
          $ref: "#/components/responses/Unauthorized401"
        "403":
          $ref: "#/components/responses/AccessDenied403"
        "422":
          $ref: "#/components/responses/InputError422"
  /homes/{homeId}/flowTemperatureOptimization:
    get:
      summary: Get the boiler's water temperature specifics.
      description: >
        Only works for homes with boilers which support an OpenTherm interface.

        Returns 404 otherwise.


        Also see the `supportsFlowTemperatureOptimization` property in the `GET
        /homes/{homeId}` response.
      operationId: getFlowTemperatureOptimization
      tags:
        - home
      parameters:
        - in: path
          name: homeId
          schema:
            $ref: "#/components/schemas/HomeId"
          required: true
          description: unique ID of a home the authenticated user has access to
      responses:
        "200":
          description: successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowTemperatureOptimization"
        "401":
          $ref: "#/components/responses/Unauthorized401"
        "403":
          $ref: "#/components/responses/AccessDenied403"
        "404":
          $ref: "#/components/responses/NotFound404"
    put:
      summary: Set the boiler's water temperature specifics.
      description: >
        Only works for homes with boilers which support an OpenTherm interface.


        Also see the `supportsFlowTemperatureOptimization` property in the `GET
        /homes/{homeId}` response.


        This operation might be the equivalent of `PUT
        /homeByBridge/{bridgeId}/boilerMaxOutputTemperature`
      operationId: setFlowTemperatureOptimization
      tags:
        - home
      parameters:
        - in: path
          name: homeId
          schema:
            $ref: "#/components/schemas/HomeId"
          required: true
          description: unique ID of a home the authenticated user has access to
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlowTemperatureOptimizationInput"
      responses:
        "204":
          description: successful response
        "401":
          $ref: "#/components/responses/Unauthorized401"
        "403":
          $ref: "#/components/responses/AccessDenied403"
        "422":
          $ref: "#/components/responses/InputError422"
  /homes/{homeId}/weather:
    get:
      summary: Get the current weather for the given home.
      operationId: getWeather
      tags:
        - home
      parameters:
        - in: path
          name: homeId
          schema:
            $ref: "#/components/schemas/HomeId"
          required: true
          description: unique ID of a home the authenticated user has access to
      responses:
        "200":
          description: successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Weather"
        "401":
          $ref: "#/components/responses/Unauthorized401"
        "403":
          $ref: "#/components/responses/AccessDenied403"
  /homes/{homeId}/presenceLock:
    put:
      summary: Manually specify whether someone at home or not.
      description: >
        This operation sets a home's `homePresence` property. 

        When this property's value is `AWAY`, the AwayConfiguration of each zone
        will control

        the (temperature) settings for that zone.


        `homePresence` can also be automatically controlled via geo-tracking
        (requires a paid Auto-Assist subscription).

        When geo-tracking is enabled, this operation overrides the
        `homePresence` value determined by

        geo-tracking.
      operationId: setPresenceLock
      tags:
        - home control
      parameters:
        - in: path
          name: homeId
          schema:
            $ref: "#/components/schemas/HomeId"
          required: true
          description: unique ID of a home the authenticated user has access to
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresenceLock"
            examples:
              HOME:
                value:
                  homePresence: HOME
              AWAY:
                value:
                  homePresence: AWAY
      responses:
        "204":
          description: successful empty response
        "401":
          $ref: "#/components/responses/Unauthorized401"
        "403":
          $ref: "#/components/responses/AccessDenied403"
        "422":
          $ref: "#/components/responses/InputError422"
    delete:
      summary: Remove the manually set home status.
      description: >
        Remove the manually set `homePresence` value as set by `PUT
        /homes/{homeId}/presenceLock`, 

        handing back control of the `homePresence` value to the geo-tracking
        capability 

        enabled on the mobile devices used to control this home.


        Requires a paid Auto-Assist subscription.
      operationId: deletePresenceLock
      tags:
        - home control
      parameters:
        - in: path
          name: homeId
          schema:
            $ref: "#/components/schemas/HomeId"
          required: true
          description: unique ID of a home the authenticated user has access to
      responses:
        "204":
          description: successful empty response
        "401":
          $ref: "#/components/responses/Unauthorized401"
        "403":
          $ref: "#/components/responses/AccessDenied403"
        "422":
          $ref: "#/components/responses/InputError422"
  /homes/{homeId}/state:
    get:
      summary: Get information about the presence state of the home.
      description: >
        `homePresence` can be automatically controlled by enabling geo-tracking
        on the mobile devices used

        to control the home 

        (see `PUT /homes/{homeId}/mobileDevices/{mobileDeviceId}/settings`,

        requires a paid Auto-Assist subscription).

        Or it can be set via `PUT /homes/{homeId}/presenceLock`
             
        When its value is `AWAY`, the AwayConfiguration of each zone will
        control 

        the (temperature) settings for that zone.
      operationId: getHomeState
      tags:
        - home control
      parameters:
        - in: path
          name: homeId
          schema:
            $ref: "#/components/schemas/HomeId"
          required: true
          description: unique ID of a home the authenticated user has access to
      responses:
        "200":
          description: successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeState"
        "401":
          $ref: "#/components/responses/Unauthorized401"
  /homes/{homeId}/zones:
    get:
      summary: Get all zones (a.k.a. rooms) associated with the provided homeId.
      description: >
        Delivers information about each zone in the given home, including the
        tado devices present in each zone.


        About the devices: there are multiple ways to list the tado devices in a
        home or zone:

        * GET /homes/{homeId}/devices 

        * GET /homes/{homeId}/deviceList

        * GET /homes/{homeId}/zones **this operation**

        * GET /homes/{homeId}/zones/{zoneId}/control


        Distinguishing features of **this operation**:

        * **DeviceType 'IB01'**: devices of DeviceType 'IB01' (Internet Bridge)
        are not included in the response

        * **duties**: the response does tell you the duties of each device

        * **zone**: the response tells you the zone each device belongs to


        Used in app feature: Home page
      operationId: getZones
      tags:
        - zone
      parameters:
        - in: path
          name: homeId
          schema:
            $ref: "#/components/schemas/HomeId"
          required: true
          description: unique ID of a home the authenticated user has access to
      responses:
        "200":
          description: successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Zone"
        "401":
          $ref: "#/components/responses/Unauthorized401"
        "403":
          $ref: "#/components/responses/AccessDenied403"
    post:
      summary: Create a new zone (a.k.a. room) and move devices to it.
      operationId: createZone
      tags:
        - zone
      parameters:
        - in: path
          name: homeId
          schema:
            $ref: "#/components/schemas/HomeId"
          required: true
          description: unique ID of a home the authenticated user has access to
        - in: query
          name: force
          schema:
            type: boolean
          description: >
            To be investigated further.  'true' seems to indicate that the zone
            the device belonged to previously should be deleted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ZoneCreate"
      responses:
        "201":
          description: successful response
        "401":
          $ref: "#/components/responses/Unauthorized401"
        "403":
          $ref: "#/components/responses/AccessDenied403"
        "422":
          $ref: "#/components/responses/InputError422"
  /homes/{homeId}/zones/{zoneId}/capabilities:
    get:
      summary: Get the climate control capabilities of this zone.
      operationId: getZoneCapabilities
      tags:
        - zone
      parameters:
        - in: path
          name: homeId
          schema:
            $ref: "#/components/schemas/HomeId"
          required: true
          description: unique ID of a home the authenticated user has access to
        - in: path
          name: zoneId
          schema:
            $ref: "#/components/schemas/ZoneId"
          required: true
          description: ID of a zone (unique within a home)
      responses:
        "200":
          description: successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZoneCapabilities"
        "401":
          $ref: "#/components/responses/Unauthorized401"
        "403":
          $ref: "#/components/responses/AccessDenied403"
        "404":
          $ref: "#/components/responses/NotFound404"
  /homes/{homeId}/zones/{zoneId}/dazzle:
    put:
      summary: Enable or disable the dazzle mode of this zone.
      description: >
        Dazzle mode is defined as: "Your tado device shows an animation when
        settings are changed via Manual Control."
      operationId: setDazzle
      tags:
        - zone
      parameters:
        - in: path
          name: homeId
          schema:
            $ref: "#/components/schemas/HomeId"
          required: true
          description: unique ID of a home the authenticated user has access to
        - in: path
          name: zoneId
          schema:
            $ref: "#/components/schemas/ZoneId"
          required: true
          description: ID of a zone (unique within a home)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DazzleInput"
      responses:
        "204":
          description: successful response
        "401":
          $ref: "#/components/responses/Unauthorized401"
        "403":
          $ref: "#/components/responses/AccessDenied403"
        "404":
          $ref: "#/components/responses/NotFound404"
        "422":
          $ref: "#/components/responses/InputError422"
  /homes/{homeId}/zones/{zoneId}/details:
    put:
      summary: Change the name of the zone
      operationId: setDetails
      tags:
        - zone
      parameters:
