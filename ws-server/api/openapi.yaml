                  description: |
                    known values:

                     * HOME

                     * HOME_LOCATION_BASED_CONTROL_OFF

                     * OPEN_WINDOW_DETECTED

                     * OVERLAY_ACTIVE

                     * MEASURING_DEVICE_DISCONNECTED
                setting:
                  $ref: "#/components/schemas/ZoneSetting"
    Temperature:
      type: object
      properties:
        celsius:
          type: number
          format: float
          example: 13.91
        fahrenheit:
          type: number
          format: float
          example: 57.02
    TemperatureCapability:
      type: object
      description: property available for zone type HEATING
      properties:
        celsius:
          type: object
          properties:
            min:
              type: integer
              example: 5
            max:
              type: integer
              example: 25
            step:
              type: number
              format: float
              example: 0.1
        fahrenheit:
          type: object
          properties:
            min:
              type: integer
              example: 41
            max:
              type: integer
              example: 77
            step:
              type: number
              format: float
              example: 0.1
    TemperatureDataPoint:
      type: object
      description: Used in Weather and ZoneState, used to express outside or inside
        temperature.
      allOf:
        - $ref: "#/components/schemas/Temperature"
        - properties:
            timestamp:
              type: string
              format: date-time
              example: 2024-08-04T09:20:08.370Z
            type:
              type: string
              example: TEMPERATURE
            precision:
              $ref: "#/components/schemas/TemperaturePrecision"
    TemperatureDataPointInTimeSeries:
      type: object
      description: Element of DayReport
      properties:
        timestamp:
          type: string
          format: date-time
          example: 2024-01-10T22:45:00.000Z
