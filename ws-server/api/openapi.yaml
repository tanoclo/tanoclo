components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        password:
          tokenUrl: /oauth/token
          scopes: {}
  responses:
    Unauthorized401:
      description: unauthorized, invalid access token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AccessDenied403:
      description: access denied, the authenticated user does not have access to the
        specified resource
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound404:
      description: not found, the specified resource does not exist
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InputError422:
      description: >
        The request body is invalid or the requested operation is not supported.
        This can have all kinds of reasons, some examples:

        * a required property is missing

        * an invalid value is used for a property

        * a particular operation is not allowed on a resource given the state of
        the resource

        * a particular zone specific operation is not supported for the zone's
        ZoneTYpe

        * a particular operation requires a paid Auto-Assist subscription which
        is not active for the home
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse422"
  schemas:
    ActivityDataPoints:
      type: object
      description: Part of ZoneState. Empty for a HOT_WATER zone
      properties:
        heatingPower:
          $ref: "#/components/schemas/PercentageDataPoint"
        acPower:
          $ref: "#/components/schemas/PowerDataPoint"
    AirComfort:
      type: object
      description: >
        Result of /homes/{homeId}/airComfort.  Comfort properties (except
        roomId) are not present when there is no connection with the measuring
        device in the room (e.g because of an empty device battery).
      properties:
        freshness:
          type: object
          properties:
            value:
              $ref: "#/components/schemas/AirFreshness"
            lastOpenWindow:
              type: string
              format: date-time
              example: 2024-08-07T16:40:03Z
            acPoweredOn:
              type: boolean
              example: false
            lastAcPowerOff:
              type: string
              format: date-time
              example: 2025-01-22T21:00:00.000Z
        comfort:
          type: array
          items:
            type: object
            properties:
              roomId:
                $ref: "#/components/schemas/ZoneId"
              temperatureLevel:
                $ref: "#/components/schemas/TemperatureLevel"
              humidityLevel:
                $ref: "#/components/schemas/HumidityLevel"
              coordinate:
                type: object
                properties:
                  radial:
                    type: number
                    format: float
                    example: 0.22
                  angular:
                    type: integer
                    example: 76
    AirConditioningZoneSettings:
      type: object
      description: used in ZoneCapabilities for zones of type AIR_CONDITIONING
      allOf:
        - $ref: "#/components/schemas/AirConditioningZoneSettingsBase"
        - properties:
            temperature:
              $ref: "#/components/schemas/Temperature"
    AirConditioningZoneSettingsBase:
      type: object
      description: used in ZoneCapabilities for zones of type AIR_CONDITIONING
      properties:
        fanLevel:
          $ref: "#/components/schemas/FanLevel"
        verticalSwing:
          $ref: "#/components/schemas/VerticalSwing"
        horizontalSwing:
          $ref: "#/components/schemas/HorizontalSwing"
        light:
          $ref: "#/components/schemas/Light"
    AirConditioningMode:
      type: string
      enum:
        - AUTO
        - COOL
        - HEAT
        - DRY
        - FAN
      example: COOL
    AirConditioningModeCapabilities:
      type: object
      description: used in ZoneCapabilities for zones of type AIR_CONDITIONING
      allOf:
        - $ref: "#/components/schemas/AirConditioningModeCapabilitiesBase"
        - properties:
            temperatures:
              $ref: "#/components/schemas/TemperatureCapability"
    AirConditioningModeCapabilitiesBase:
      type: object
      description: used in ZoneCapabilities for zones of type AIR_CONDITIONING
      properties:
        fanLevel:
          type: array
          items:
            $ref: "#/components/schemas/FanLevel"
        verticalSwing:
          type: array
          items:
            $ref: "#/components/schemas/VerticalSwing"
        horizontalSwing:
          type: array
          items:
            $ref: "#/components/schemas/HorizontalSwing"
        light:
          type: array
          items:
            $ref: "#/components/schemas/Light"
    AirFreshness:
      type: string
      enum:
        - FAIR
        - FRESH
      example: FRESH
      description: The air freshness level for the entire home. Used in AirComfort.
    AwayRadiusInput:
      type: object
      properties:
        awayRadiusInMeters:
          type: number
          format: float
          example: 400
    BatteryState:
      type: string
      enum:
        - LOW
        - NORMAL
      example: NORMAL
      description: device property known to be present for DeviceType SU02, VA02
    Boiler1:
      type: object
      description: element of HeatingSystem
      properties:
        present:
          type: boolean
          example: true
        id:
          type: integer
          example: 2699
          description: Tado specific id of the type of boiler you have, it gets set when
            you select a boiler via the app
        found:
          type: boolean
          example: true
    Boiler2:
      type: object
      description: Response of GET /homeByBridge/{bridgeId}/boilerInfo
      properties:
        boilerPresent:
          type: boolean
          example: true
        boilerId:
          type: integer
          example: 2699
          description: >
            Tado specific id of the type of boiler you have, it gets set when
            you select a boiler via the app     
    BoilerMaxOutputTemperature:
      type: object
      description: Used in GET/POST /homeByBridge/{bridgeId}/boilerMaxOutputTemperature
      properties:
        boilerMaxOutputTemperatureInCelsius:
          type: number
          format: float
          example: 55
    BoilerWiringInstallationState:
      type: object
      description: response of GET /homeByBridge/{bridgeId}/boilerWiringInstallationState
      properties:
        state:
          type: string
          example: INSTALLATION_COMPLETED
        deviceWiredToBoiler:
          type: object
          properties:
            type:
              type: string
              example: BR02
            serialNo:
              type: string
              example: BR123456789
            thermInterfaceType:
              type: string
              example: UBA_BUS
              description: |
                known values:

                * OPENTHERM
                * UBA_BUS
            connected:
              type: boolean
              example: true
            lastRequestTimestamp:
              type: string
              format: date-time
              example: 2024-12-30T11:10:24.433Z
        bridgeConnected:
          type: boolean
          example: true
        hotWaterZonePresent:
          type: boolean
          example: true
        boiler:
          type: object
          properties:
            outputTemperature:
              type: object
              properties:
                celsius:
                  type: number
                  format: float
                  example: "56.0"
                timestamp:
                  type: string
                  format: date-time
                  example: 2024-12-30T10:58:44.000Z
    BooleanDataInterval:
      type: object
      description: Element of DayReport and ZoneState. Used to express
        measuredData.measuringDeviceConnected (ZoneState), hotWaterProduction
        (ZoneState) and weather.sunny (DayReport)
      allOf:
        - $ref: "#/components/schemas/DataInterval"
        - properties:
            value:
              type: boolean
              example: true
    BooleanTimeSeries:
      type: object
      description: >
        Element of DayReport and ZoneState.  Used to express
        measuredData.measuringDeviceConnected (ZoneState), hotWaterProduction
        (ZoneState)  and weather.sunny (DayReport)
      properties:
        timeSeriesType:
          type: string
          example: dataIntervals
        valueType:
          type: string
          example: boolean
        dataIntervals:
          type: array
          items:
            $ref: "#/components/schemas/BooleanDataInterval"
    Bridge:
      type: object
      description: tado Internet Bridge
      properties:
        partner:
          description: meaning and type of this property is unknown
        homeId:
          $ref: "#/components/schemas/HomeId"
    BridgeId:
      type: string
      example: IB1234567890
      description: the serialNo of a tado Internet bridge
    CallForHeatTimeSeries:
      type: object
      description: element of DayReport
      properties:
        timeSeriesType:
          type: string
          example: dataIntervals
        valueType:
          type: string
          example: callForHeat
        dataIntervals:
          type: array
          items:
            $ref: "#/components/schemas/CallForHeatDataInterval"
    CallForHeatDataInterval:
      type: object
      description: element of DayReport
      allOf:
        - $ref: "#/components/schemas/DataInterval"
        - properties:
            value:
              $ref: "#/components/schemas/CallForHeatValue"
    CallForHeatValue:
      type: string
      enum:
        - NONE
        - LOW
        - MEDIUM
        - HIGH
      example: LOW
      description: element of DayReport
    ChildLock:
      type: object
      description: input for PUT /devices/{deviceId}/childLock
      properties:
        childLockEnabled:
          type: boolean
          example: false
    DataInterval:
      type: object
      description: element of a DayReport
      properties:
        from:
          type: string
          format: date-time
          example: 2024-01-10T22:45:00.000Z
        to:
          type: string
          format: date-time
          example: 2024-01-11T23:15:00.000Z
    DayReport:
      type: object
      description: result of /homes/{homeId}/zones/{zoneId}/dayReport
      properties:
        zoneType:
          $ref: "#/components/schemas/ZoneType"
        interval:
          type: object
          properties:
            from:
              type: string
              format: date-time
              example: 2024-01-10T22:45:00.000Z
            to:
              type: string
              format: date-time
              example: 2024-01-11T23:15:00.000Z
        hoursInDay:
          type: integer
          example: 24
        measuredData:
          properties:
            measuringDeviceConnected:
              $ref: "#/components/schemas/BooleanTimeSeries"
            insideTemperature:
              $ref: "#/components/schemas/TemperatureTimeSeries"
            humidity:
              $ref: "#/components/schemas/PercentageTimeSeries"
        stripes:
          $ref: "#/components/schemas/StripesTimeSeries"
        settings:
          $ref: "#/components/schemas/ZoneSettingTimeSeries"
        callForHeat:
          $ref: "#/components/schemas/CallForHeatTimeSeries"
        hotWaterProduction:
          $ref: "#/components/schemas/BooleanTimeSeries"
        acActivity:
          $ref: "#/components/schemas/PowerTimeSeries"
        weather:
          type: object
          properties:
            condition:
              $ref: "#/components/schemas/WeatherConditionTimeSeries"
            sunny:
              $ref: "#/components/schemas/BooleanTimeSeries"
            slots:
              $ref: "#/components/schemas/WeatherSlotTimeSeries"
    DayType:
      type: string
      enum:
        - MONDAY_TO_SUNDAY
        - MONDAY_TO_FRIDAY
        - MONDAY
        - TUESDAY
        - WEDNESDAY
        - THURSDAY
        - FRIDAY
        - SATURDAY
        - SUNDAY
      example: MONDAY_TO_FRIDAY
      description: >
        used in timetables


        applicable values: 

        * for timetableType 0 (ONE_DAY) : MONDAY_TO_SUNDAY

        * for timetableType 1 (THREE_DAY): MONDAY_TO_FRIDAY, SATURDAY, SUNDAY

        * for timetableType 2 (SEVEN_DAY): MONDAY, TUESDAY, WEDNESDAY, THURSDAY,
        FRIDAY, SATURDAY, SUNDAY
    DazzleInput:
      type: object
      description: Used in PUT /homes/{homeId}/zones/{zoneId}/dazzle
      properties:
        enabled:
          type: boolean
          example: true
    DefaultZoneOverlay:
      type: object
      description: >
        Used in /homes/{homeId}/zones/{zoneId}/defaultOverlay.

        It defines the default zone overlay termination type which TaNoClo will
        use when a user set zone settings (like temperature) via a physical tado
        device like a Smart Thermostat. (this results in setting a ZoneOverlay).

        The `type` defined here is used as the value for
        ZoneOverlay.termination.typeSkillBasedApp when setting a ZoneOverlay.
      properties:
        terminationCondition:
          type: object
          properties:
            type:
              $ref: "#/components/schemas/ZoneOverlayTerminationType"
            durationInSeconds:
              type: integer
              example: 600
              description: only applicable when type is TIMER
    Device:
      type: object
      description: >
        A piece of tado hardware


        Some of the properties are only available for certain device
        types.  Certain values for some properties are only applicable to
        certain device types.  Wherever device type specific information is
        known, it is documented.  But you cannot count on this information being
        fully complete.
      properties:
        deviceType:
          $ref: "#/components/schemas/DeviceType"
        serialNo:
          $ref: "#/components/schemas/DeviceId"
        shortSerialNo:
          type: string
          example: SU4126044345
        currentFwVersion:
          type: string
          example: 215.1
        connectionState:
          type: object
          description: property known to be present for DeviceType SU02, VA02, BR02
          properties:
            value:
              type: boolean
              example: true
            timestamp:
              type: string
              format: date-time
              example: 2022-11-25T09:40:14.803Z
        characteristics:
          type: object
          properties:
            capabilities:
              type: array
              description: array known to be empty for DeviceType BR02
              items:
                type: string
                example: INSIDE_TEMPERATURE_MEASUREMENT
                description: >
                  known values: 

                  * INSIDE_TEMPERATURE_MEASUREMENT (seen for DeviceType SU02,
                  VA02)

                  * IDENTIFY (seen for DeviceType SU02, VA02)

                  * RADIO_ENCRYPTION_KEY_ACCESS (seen for DeviceType IB01)
        mountingState:
          type: object
          description: property known to be present for DeviceType VA02
          properties:
            value:
              type: string
              example: CALIBRATED
              description: |
                known values: 
                * CALIBRATED
                * CALIBRATING
            timestamp:
              type: string
              format: date-time
              example: 2022-11-25T09:40:14.803Z
        mountingStateWithError:
          type: string
          example: CALIBRATED
          description: |
            property known to be present for DeviceType VA02; 
            known values: 
            * CALIBRATED
            * CALIBRATING
        batteryState:
          $ref: "#/components/schemas/BatteryState"
        orientation:
          $ref: "#/components/schemas/Orientation"
        childLockEnabled:
          type: boolean
          example: false
          description: property known to be present for DeviceType VA02
        isDriverConfigured:
          type: boolean
          example: true
          description: property known to be present for DeviceType BR02
        inPairingMode:
          type: boolean
          example: false
          description: property known to be present for DeviceType IB01
        accessPointWiFi:
          type: object
          description: property known to be present for DeviceType WR02 (AC control)
          properties:
            ssid:
              type: string
              example: tado1234
        commandTableUploadState:
          type: string
          example: FAILED
          description: property known to be present for DeviceType WR02 (AC control)
    DeviceExtra:
      description: >
        A piece of tado hardware.


        Some of the properties are only available for certain device
        types.  Certain values for some properties are only applicable for
        certain device types.  Wherever device type specific information is
        known, it is documented.
      allOf:
        - $ref: "#/components/schemas/Device"
        - properties:
            duties:
              type: array
              items:
                type: string
                example: ZONE_UI
                description: >
                  known values: 

                  * ZONE_UI (seen for DeviceType SU02, VA02)

                  * ZONE_LEADER (seen for DeviceType SU02, VA02; 
                    indicates that the device is the temperature measuring device for the zone)

                  * ZONE_DRIVER (seen for DeviceType VA02)
    DeviceId:
      type: string
      example: SU4126044356
      description: the serialNo of a tado device
    DeviceList:
      type: object
      description: result of /homes/{homeId}/zones/{zoneId}/deviceList
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/DeviceListItem"
    DeviceListItem:
      type: object
      description: Element of DeviceList
      properties:
        type:
          $ref: "#/components/schemas/DeviceType"
        device:
          $ref: "#/components/schemas/Device"
        zone:
          type: object
          description: This property is not present for devices of type 'IB01' (Internet
            Bridge) and 'BR02' (Wireless Receiver).
          properties:
            discriminator:
              $ref: "#/components/schemas/ZoneId"
            duties:
              type: array
              description: This property has only been seen for devices of type 'SU02'
              items:
                type: string
                example: UI
                description: |
                  known values: 
                  * UI (seen for DeviceType SU02)"
    DeviceType:
      type: string
      example: SU02
      description: |
        data element of Device

        known values: 
        * GW01 (Gateway V1)
        * GW02 (Bridge V2)
        * IB01 (Internet Bridge V3+)
        * BX02 (Box V1)
        * BU01 (Extension Kit UK)
        * EK01 (Extension Kit UK)
        * BR02 (Wireless Receiver V3+)
        * BP02 (Wireless Receiver UK V3+)
        * RU01 (Smart Thermostat V3)
        * RU02 (Wired Smart Thermostat V3+)
        * TS02 (Temp Sensor V1)
        * SU02 (Wireless Temperature Sensor V3+)
        * VA01 (Smart Radiator Thermostat V3)
        * VA02 (Smart Radiator Thermostat V3+)
        * WR01 (Smart AC Control V3)
        * WR02 (Smart AC Control V3+)
    EarlyStart:
      type: object
      properties:
        enabled:
          type: boolean
          example: false
    Error:
      type: object
      properties:
        code:
          type: string
          description: meaningful textual code associated with the HTTP status code like
            'accessDenied' (for 403) or 'unauthorized' for (401)
        title:
          type: string
          description: detailed description of the error in natural language (english)
    Error422:
      description: >
        The zoneType is only available for certain 422 errors,  to indicate that
        a certain zone specific operation is not allowed because of the ZoneType
        of the zone.
      type: object
      allOf:
        - $ref: "#/components/schemas/Error"
        - properties:
            zoneType:
              $ref: "#/components/schemas/ZoneType"
    ErrorResponse:
      type: object
      description: error object returned for non-200 responses
      properties:
        errors:
          type: array
          items:
            $ref: "#/components/schemas/Error"
    ErrorResponse422:
      type: object
      description: error object returned for 422 responses
      properties:
        errors:
          type: array
          items:
            $ref: "#/components/schemas/Error422"
    FanLevel:
      type: string
      enum:
        - AUTO
        - LEVEL1
        - LEVEL2
        - LEVEL3
        - LEVEL4
        - LEVEL5
        - SILENT
      description: Used in AirConditioningZoneSettingsBase and
        AirConditioningModeCapabilitiesBase
    FlowTemperatureOptimization:
      type: object
      description: Result of 'GET /homes/{homeId}/flowTemperatureOptimization'
      properties:
        hasMultipleBoilerControlDevices:
          type: boolean
          example: false
        maxFlowTemperature:
          type: integer
          example: 50
          description: >
            Not clear if this property always represents a centigrade value, or
            if the unit is based on `Home.temperatureUnit`
        maxFlowTemperatureConstraints:
          type: object
          properties:
            min:
              type: integer
              example: 30
              description: >
                Not clear if this property always represents a centigrade value,
                or if the unit is based on `Home.temperatureUnit`
            max:
              type: integer
              example: 80
              description: >
                Not clear if this property always represents a centigrade value,
                or if the unit is based on `Home.temperatureUnit`
        autoAdaptation:
          type: object
          properties:
            enabled:
              type: boolean
              example: false
            maxFlowTemperature:
              type: integer
              nullable: true
        openThermDeviceSerialNumber:
          type: string
    FlowTemperatureOptimizationInput:
      description: Input for 'PUT /homes/{homeId}/flowTemperatureOptimization'
      properties:
        maxFlowTemperature:
          type: number
          example: 50
          description: >
            Not clear if this property always represents a centigrade value, or
            if the unit is based on `Home.temperatureUnit`
    HeatingCircuit:
      type: object
      description: |
        Result of /homes/{homeId}/heatingCircuits

        A tado device which controls a heating circuit
      properties:
        number:
          $ref: "#/components/schemas/HeatingCircuitId"
        driverSerialNo:
          type: string
          example: BR3209250550
          description: serial number of the tado device which controls the heating circuit
        driverShortSerialNo:
          type: string
          example: BR3209250550
          description: short serial number of the tado device which controls the heating
            circuit
    HeatingCircuitId:
      type: integer
      example: 1
    HeatingCircuitInput:
      description: Used in PUT /homes/{homeId}/zones/{zoneId}/control/heatingCircuit
      type: object
      properties:
        circuitNumber:
          $ref: "#/components/schemas/HeatingCircuitId"
    HeatingSystem:
      type: object
      description: result of /homes/{homeId}/heatingSystem
      properties:
        boiler:
          $ref: "#/components/schemas/Boiler1"
        underfloorHeating:
          $ref: "#/components/schemas/UnderfloorHeating"
    Home:
      description: A home controlled by TaNoClo. Result of /homes
      allOf:
        - $ref: "#/components/schemas/HomeDetails"
        - properties:
            dateTimeZone:
              type: string
              example: Europe/Amsterdam
            dateCreated:
              type: string
              format: date-time
              example: 2022-11-25T09:40:14.803Z
            temperatureUnit:
              $ref: "#/components/schemas/TemperatureUnit"
            partner:
              description: meaning and type of this property is unknown
              nullable: true
            simpleSmartScheduleEnabled:
              type: boolean
              example: true
            awayRadiusInMeters:
              type: number
              format: float
              example: 400
            installationCompleted:
              type: boolean
              example: true
            incidentDetection:
              $ref: "#/components/schemas/IncidentDetection"
            generation:
              type: string
              example: PRE_LINE_X
              description: |
                known values:
                * PRE_LINE_X
                * LINE_X
            zonesCount:
              type: integer
              example: 5
              description: number of zones is this home
            language:
              type: string
              example: nl
            skills:
              type: array
              items:
                type: string
              description: this is assumed to be an array of strings, currently tested set-up
                returns an empty array
            christmasModeEnabled:
              type: boolean
              example: true
              description: no idea what this means, but would be really interesting to know
                more...
            showAutoAssistReminders:
              type: boolean
              example: true
            consentGrantSkippable:
              type: boolean
              example: true
            enabledFeatures:
              type: array
              items:
                type: string
                description: |
                  known values: 
                  * AA_SETTINGS_AS_WEBVIEW
                  * AA_UPSELLING_A
                  * CLIMATE_REPORT_AS_WEBVIEW
                  * EIQ_SETTINGS_AS_WEBVIEW
                  * ELIGIBLE_FOR_ENERGY_CONSUMPTION
                  * ENERGY_CONSUMPTION
                  * HIDE_BOILER_REPAIR_SERVICE
                  * HOME_SCREEN_AS_WEBVIEW_PROD
                  * HOME_SCREEN_AS_WEBVIEW_PROD_ANDROID
                  * OWD_SETTINGS_AS_WEBVIEW
                  * ROOMS_AND_DEVICES_SETTING_AS_WEBVIEW
                  * SMART_SCHEDULE_AS_WEBVIEW
            isAirComfortEligible:
              type: boolean
              example: true
            isBalanceAcEligible:
              type: boolean
              example: false
            isEnergyIqEligible:
              type: boolean
              example: true,
            isHeatSourceInstalled:
              type: boolean
              example: false
            isBalanceHpEligible:
              type: boolean
              example: false
            isHeatPumpInstalled:
              type: boolean
              example: false
            supportsFlowTemperatureOptimization:
              type: boolean
              example: false
    HomeBase:
      type: object
      description: basic home information which is present in the User component
      properties:
        id:
          $ref: "#/components/schemas/HomeId"
        name:
          type: string
          description: user assigned name for this home
          example: my home
    HomeDetails:
      description: Part of the Home component. And used in PUT /homes/{homeId}/homeDetails
      allOf:
        - $ref: "#/components/schemas/HomeBase"
        - properties:
            contactDetails:
              type: object
              description: >
                the primary contact for this home;  also appears to be the only
                one to receive any email notifications (like 'low battery' or
                'open window' warnings)
              properties:
                name:
                  type: string
                  example: Admin
                email:
                  type: string
                  example: admin@tanoclo.local
                phone:
                  type: string
                  example: "+31123456789"
            address:
              type: object
              description: postal address of this home
              properties:
                addressLine1:
                  type: string
                  example: Kerkstraat 1
                addressLine2:
                  type: string
                  nullable: true
                zipCode:
                  type: string
                  example: 1234AA
                city:
                  type: string
                  example: Utrecht
                state:
                  type: string
                  nullable: true
                country:
                  type: string
                  description: most probably an ISO 3166-1 alpha-3 country code
                  example: NLD
            geolocation:
              type: object
              description: Geo location of this home.
              properties:
                latitude:
                  type: number
                  format: float
                  example: 50.1234567
                longitude:
                  type: number
                  format: float
                  example: -1.1234567
    HomeId:
      type: integer
      format: int64
      example: 1118186
      description: unique home ID
    HomePresence:
      type: string
      enum:
        - HOME
        - AWAY
      example: HOME
    HomeState:
      type: object
      description: >
        Indicates if TaNoClo acts as if there are people present in the home or
        not. Result of /homes/{homeId}/state.


        Presence can be auto-determined by TaNoClo based on geo-tracking of the
        mobile devices linked to the home.
      properties:
        presence:
          $ref: "#/components/schemas/HomePresence"
        presenceLocked:
          type: boolean
          example: true
        showHomePresenceSwitchButton:
          type: boolean
          example: true
          description: >
            This property is present when all mobile devices linked to this home
            which have geo-tracking enabled 

            are no longer in (or near) the home.


            It is a hint to the user to manually set the home presence to AWAY. 
    HorizontalSwing:
      type: string
      enum:
        - OFF
        - ON
        - RIGHT
        - LEFT
        - MID_RIGHT
        - MID_LEFT
      description: Used in AirConditioningZoneSettingsBase and
        AirConditioningModeCapabilitiesBase
    HumidityLevel:
      type: string
      enum:
        - HUMID
        - COMFY
        - DRY
      example: DRY
      description: Element of AirComfort
    IncidentDetection:
      type: object
      description: Data elements of a Home. And used in /homes/{homeId}/incidentDetection
      properties:
        enabled:
          type: boolean
          example: true
        supported:
          type: boolean
          example: true
    IncidentDetectionInput:
      type: object
      description: Used in PUT /homes/{homeId}/incidentDetection
      properties:
        enabled:
          type: boolean
          example: true
    Installation:
      type: object
      description: |
        Result of GET /home/{homeId}/installations.
        Only present for ACs.
      properties:
        id:
          $ref: "#/components/schemas/InstallationId"
        type:
          type: string
          example: INSTALL_AC_G1
        revision:
          type: integer
          example: 7
        state:
          type: string
          example: COMPLETED
        devices:
          type: array
          items:
            $ref: "#/components/schemas/Device"
        acInstallationInformation:
          type: object
          properties:
            wirelessRemoteHasRequiredFirmware:
              type: boolean
              example: true
            acSpecs:
              type: object
              properties:
                acUnitDisplaysSetPointTemperature:
                  type: boolean
                  example: false
                remoteControl:
                  type: object
                  properties:
                    commandType:
                      type: string
                      example: AC_SETTING
                    temperatureUnit:
                      $ref: "#/components/schemas/TemperatureUnit"
                    modelName:
                      nullable: true
                    photoS3Key:
                      nullable: true
                manufacturer:
                  type: object
                  properties:
                    name:
                      type: string
                      example: not specified
            keyCommandSetRecording:
              nullable: true
            acSettingCommandSetRecording:
              nullable: true
            createdZone:
              type: object
              properties:
                id:
                  $ref: "#/components/schemas/ZoneId"
            selectedSetupBranch:
              type: string
              example: NON_THERMOSTATIC
    InstallationId:
      type: integer
      example: 0
      description: ID of an (AC) installation (unique only within the home it belongs to)
    Invitation:
      type: object
      properties:
        token:
          $ref: "#/components/schemas/InvitationToken"
        email:
          type: string
          format: email
          example: me@example.org
        firstSent:
          type: string
          format: date
          example: 2025-02-03T18:44:14.658Z
        lastSent:
          type: string
          format: date
          example: 2025-02-03T18:44:14.658Z
        inviter:
          type: object
          properties:
            name:
              type: string
              example: Jane Doe
            email:
              type: string
              format: email
              example: me@example.org
            username:
              type: string
            enabled:
              type: boolean
              example: true
            id:
              type: string
              format: uuid
              example: a7c7fc08-e362-4700-e9a1-45a5bded5c124
              description: globally unique user ID
            homeId:
              $ref: "#/components/schemas/HomeId"
            locale:
              type: string
              example: en
            type:
              type: string
              example: WEB_USER
        home:
          $ref: "#/components/schemas/Home"
    InvitationToken:
      type: string
      example: adc17324216348e287318e8ae1f390fd
      description: hexadecimal unique invitation identifier
    InvitationRequest:
      type: object
      description: input for POST /homes/{homeId}/invitations
      properties:
        email:
          type: string
          format: email
    Light:
      type: string
      enum:
        - OFF
        - ON
      description: Used in AirConditioningZoneSettingsBase and
        AirConditioningModeCapabilitiesBase
    MobileDevice:
      type: object
      description: >
        A phone/tablet/iPad which has the TaNoClo app installed, belonging to a
        particular user who is a member/resident of a home controlled by
        TaNoClo.
      properties:
        id:
          $ref: "#/components/schemas/MobileDeviceId"
        name:
          type: string
          example: my device
          description: user assigned name for this device
        settings:
          $ref: "#/components/schemas/MobileDeviceSettings"
        location:
          $ref: "#/components/schemas/MobileDeviceLocation"
        deviceMetadata:
          type: object
          properties:
            platform:
              type: string
              example: Android
            osVersion:
              type: string
              example: 11
            model:
              type: string
              example: Samsung_SM-T720
            locale:
              type: string
              example: nl
    MobileDeviceId:
      type: integer
      format: int64
      example: 8254700
    MobileDeviceLocation:
      type: object
      description: >
        This data element is only present for mobile devices which have
