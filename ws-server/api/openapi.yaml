  /homes/{homeId}/zones/{zoneId}/control:
    get:
      summary: >
        Returns the heating circuit the zone (a.k.a. room) belongs to, and the
        tado devices within the zone  grouped by their duty. 
      description: >
        There are multiple ways to list the tado devices in a home or zone:

        * GET /homes/{homeId}/devices 

        * GET /homes/{homeId}/deviceList 

        * GET /homes/{homeId}/zones

        * GET /homes/{homeId}/zones/{zoneId}/control **this operation**


        Distinguishing features of **this operation**:

        * **device types**: devices of DeviceType 'IB01' (Internet Bridge) and
        'BR02' (Wireless Receiver) are not included in the response

        * **duties**: the response tells you thy duty each device has (ui,
        driver, leader)

        * **zone**: the response tells you the zone each device belongs to
      operationId: getZoneControl
      tags:
        - device
        - heating circuit
      parameters:
        - in: path
          name: homeId
          schema:
            $ref: "#/components/schemas/HomeId"
          required: true
          description: unique ID of a home the authenticated user has access to
        - in: path
          name: zoneId
          schema:
            $ref: "#/components/schemas/ZoneId"
          required: true
          description: ID of a zone (unique within a home)
      responses:
        "200":
          description: successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZoneControl"
        "401":
          $ref: "#/components/responses/Unauthorized401"
        "403":
          $ref: "#/components/responses/AccessDenied403"
        "404":
          $ref: "#/components/responses/NotFound404"
  /homes/{homeId}/zones/{zoneId}/control/heatingCircuit:
    put:
      summary: Assign the zone to a specific heating circuit or make it independent of
        a heating circuit.
      description: >
        See /homes/{homeId}/heatingCircuits to get a list of heating circuits in
        a home.

        In the tado documentation a heating circuit is called a 'heating
        zone'.  It is defined as  "A Heating Zone refers to the piping system
        that carries hot water from the boiler to your rooms, 
         and back to the boiler."

        A 'heating zone' is not to be confused with a 'zone'; a 'zone'
        represents a single room  which is serviced by a 'heating zone'
      operationId: setHeatingCircuit
      tags:
        - heating circuit
      parameters:
        - in: path
          name: homeId
          schema:
            $ref: "#/components/schemas/HomeId"
          required: true
          description: unique ID of a home the authenticated user has access to
        - in: path
          name: zoneId
          schema:
            $ref: "#/components/schemas/ZoneId"
          required: true
          description: ID of a zone (unique within a home)
      requestBody:
        required: false
        description: leave it empty to remove a zone from a heating cicruit
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HeatingCircuitInput"
      responses:
        "200":
          description: successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZoneControl"
        "401":
          $ref: "#/components/responses/Unauthorized401"
        "403":
          $ref: "#/components/responses/AccessDenied403"
        "404":
          $ref: "#/components/responses/NotFound404"
        "422":
          $ref: "#/components/responses/InputError422"
