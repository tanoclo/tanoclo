                            type: array
                            items:
                              type: object
                      solarIntensity:
                        type: object
                        properties:
                          timeSeriesType:
                            type: string
                          valueType:
                            type: string
                          min:
                            type: number
                            nullable: true
                          max:
                            type: number
                            nullable: true
                          dataPoints:
                            type: array
                            items:
                              type: object
                  stripes:
                    type: object
                    properties:
                      timeSeriesType:
                        type: string
                      valueType:
                        type: string
                      dataIntervals:
                        type: array
                        items:
                          type: object
                  settings:
                    type: object
                    properties:
                      timeSeriesType:
                        type: string
                      valueType:
                        type: string
                      dataIntervals:
                        type: array
                        items:
                          type: object
                  callForHeat:
                    type: object
                    properties:
                      timeSeriesType:
                        type: string
                      valueType:
                        type: string
                      dataIntervals:
                        type: array
                        items:
                          type: object
                  hotWaterProduction:
                    type: object
                    properties:
                      timeSeriesType:
                        type: string
                      valueType:
                        type: string
                      dataIntervals:
                        type: array
                        items:
                          type: object
                  presence:
                    type: object
                    properties:
                      timeSeriesType:
                        type: string
                      valueType:
                        type: string
                      dataIntervals:
                        type: array
                        items:
                          type: object
                  weather:
                    type: object
