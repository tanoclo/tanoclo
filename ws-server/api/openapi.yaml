  /api/public/health:
    get:
      summary: Public health check endpoint
      description: Returns simple ok status for public connection checks.
      servers:
        - url: /
      security: []
      responses:
        "200":
          description: Service is healthy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /api/health:
    get:
      summary: Health check endpoint
      description: Returns service status, database connectivity status, latency,
        database connection pool statistics, and service uptime.
      servers:
        - url: /
      responses:
        "200":
          description: Service is healthy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  db:
                    type: string
                    example: ok
                  dbLatencyMs:
                    type: integer
                    example: 3
                  uptime:
                    type: number
                    example: 3254.67
                  timestamp:
                    type: string
                    example: 2026-07-03T09:12:00.000Z
                  pool:
                    type: object
                    properties:
                      total:
                        type: integer
                        example: 25
                      idle:
                        type: integer
                        example: 24
                      waiting:
                        type: integer
                        example: 0
                      limit:
                        type: integer
                        example: 25
        "503":
          description: Service degraded (database offline).
  /oauth/token:
    post:
      summary: Request OAuth token
      description: Get an access token for client authentication.
      servers:
        - url: /
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - grant_type
                - client_id
              properties:
                grant_type:
                  type: string
                  enum:
                    - password
                    - refresh_token
                client_id:
                  type: string
                  example: tado-web-app
                client_secret:
                  type: string
                username:
                  type: string
                  example: user@example.com
                password:
                  type: string
                scope:
                  type: string
                  example: home.user
      responses:
        "200":
          description: OAuth access token generated successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
