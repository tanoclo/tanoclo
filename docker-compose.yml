services:
  db:
    image: mysql:8.0
    container_name: tanoclo-db
    restart: always
    environment:
      MYSQL_DATABASE: tanoclo
      MYSQL_USER: tanoclo
      MYSQL_PASSWORD:  DSNLksad34b321&*23321
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - tanoclo-network

  node:
    build:
      context: .
      dockerfile: Dockerfile.node
    container_name: tanoclo-ws
    restart: always
    environment:
      DB_HOST: db
      DB_NAME: tanoclo
      DB_USER: tanoclo
      DB_PASS: DSNLksad34b321&*23321
      JWT_SECRET: A7FKICASNDKJ213boi2alsd2343$*&*
      WS_PORT: 988
      HTTP_API_PORT: 3111
      LOG_LEVEL: info
    volumes:
      - ./ws-server:/app/ws-server
    ports:
      - "988:988"
      - "3111:3111"
    depends_on:
      - db
    networks:
      - tanoclo-network

  nginx:
    image: nginx:alpine
    container_name: tanoclo-nginx
    restart: always
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./ssl:/etc/nginx/ssl  # Assuming SSL certs are in ./ssl/
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - node
    networks:
      - tanoclo-network

networks:
  tanoclo-network:
    driver: bridge

volumes:
  db_data:
